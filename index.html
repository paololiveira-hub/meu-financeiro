<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f5c4d">
<title>Meu Financeiro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
         background: #0f5c4d; color: #fff; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; padding: 24px; }
  img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  h1 { font-size: 24px; margin: 18px 0 6px; }
  p { margin: 6px 0; opacity: .9; font-size: 15px; line-height: 1.4; max-width: 340px; }
  button { margin-top: 14px; font: inherit; font-size: 16px; font-weight: 600; border: 0; border-radius: 24px; padding: 13px 26px;
           background: #fff; color: #0f5c4d; cursor: pointer; min-width: 220px; }
  button.sec { background: transparent; color: #fff; border: 1px solid #ffffff80; font-weight: 400; }
  input { width: 100%; max-width: 340px; margin-top: 12px; padding: 12px; border-radius: 10px; border: 0; font-size: 14px; }
  .oculto { display: none; }
  small { position: fixed; bottom: 12px; opacity: .55; font-size: 12px; }
</style>
</head>
<body>
  <img src="icone-192.png" alt="">
  <h1>Meu Financeiro</h1>

  <div id="abrindo" class="oculto">
    <p>Abrindo sua planilha…</p>
    <button id="btnAbrir">Abrir o chat</button>
    <button id="btnInstalar" class="sec oculto">📲 Instalar como app</button>
    <button id="btnTrocar" class="sec">Trocar link</button>
  </div>

  <div id="config" class="oculto">
    <p>Cole o link do seu app do Apps Script<br>(aquele que termina em <b>/exec</b>):</p>
    <input id="link" type="url" placeholder="https://script.google.com/macros/s/.../exec">
    <button id="btnSalvar">Salvar e abrir</button>
    <p id="erro" style="color:#ffd0d0"></p>
  </div>

  <small>Prático na Tela</small>

<script>
  // Se quiser deixar o link fixo, cole aqui entre as aspas:
  var LINK_FIXO = '';

  var CHAVE = 'meuFinanceiroLink';
  function lerLink() { try { return LINK_FIXO || localStorage.getItem(CHAVE) || ''; } catch (e) { return LINK_FIXO; } }
  function valido(u) { return /^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[\w-]+\/exec/.test(u); }
  function mostrar(id) { ['abrindo', 'config'].forEach(function (x) { document.getElementById(x).classList.toggle('oculto', x !== id); }); }
  function abrir() { var u = lerLink(); if (valido(u)) location.href = u; else mostrar('config'); }

  document.getElementById('btnAbrir').onclick = abrir;
  document.getElementById('btnTrocar').onclick = function () { document.getElementById('link').value = lerLink(); mostrar('config'); };
  document.getElementById('btnSalvar').onclick = function () {
    var u = document.getElementById('link').value.trim().split('?')[0];
    if (!valido(u)) { document.getElementById('erro').textContent = 'Esse link não parece ser do Apps Script (precisa terminar em /exec).'; return; }
    try { localStorage.setItem(CHAVE, u); } catch (e) {}
    location.href = u;
  };

  // Botão de instalar (Chrome/Android)
  var pedidoInstalar = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); pedidoInstalar = e; document.getElementById('btnInstalar').classList.remove('oculto');
  });
  document.getElementById('btnInstalar').onclick = function () {
    if (!pedidoInstalar) return; pedidoInstalar.prompt();
    pedidoInstalar.userChoice.then(function () { document.getElementById('btnInstalar').classList.add('oculto'); pedidoInstalar = null; });
  };

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

  var instalado = window.matchMedia('(display-mode: standalone)').matches;
  if (!valido(lerLink())) mostrar('config');
  else {
    mostrar('abrindo');
    var jaAbriu = false; try { jaAbriu = sessionStorage.getItem('abriu'); sessionStorage.setItem('abriu', '1'); } catch (e) {}
    if (instalado && !jaAbriu) setTimeout(abrir, 400);
  }
</script>
</body>
</html>
